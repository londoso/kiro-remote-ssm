name: Deploy crew-remote

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - crew-remote.yaml
      - .github/workflows/deploy.yml

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-crew-remote
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: crew-remote
  TEMPLATE_FILE: crew-remote.yaml
  ROLE_ARN: ${{ secrets.ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions

      - name: Validate template
        run: |
          aws cloudformation validate-template \
            --template-body file://${{ env.TEMPLATE_FILE }}

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file ${{ env.TEMPLATE_FILE }} \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Read InstanceId output
        id: outputs
        run: |
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "### crew-remote deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**InstanceId:** \`$INSTANCE_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual step: connect via SSM, then as ec2-user run \`kiro-cli login --use-device-flow\`, then \`sudo systemctl restart kirocrew\`." >> "$GITHUB_STEP_SUMMARY"
